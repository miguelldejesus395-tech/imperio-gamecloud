<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050b14">
  <title>Império GameCloud</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #03070d;
      --panel: #091321;
      --panel2: #0d1b2b;
      --line: #1d3852;
      --text: #f1f6ff;
      --muted: #9eb0c2;
      --accent: #eaff00;
      --green: #29e878;
      --red: #ff5368;
      --blue: #4da3ff;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% -10%, #18314d 0, transparent 38%),
        linear-gradient(180deg, #050b14 0%, #02050a 100%);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 1px solid var(--line);
      background: #11243a;
      color: var(--text);
      border-radius: 12px;
      padding: 13px 16px;
      cursor: pointer;
      transition: .15s ease;
    }

    button:hover {
      transform: translateY(-1px);
      border-color: #557693;
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
      transform: none;
    }

    .primary {
      background: var(--accent);
      color: #071000;
      border-color: var(--accent);
      font-weight: 900;
    }

    .green {
      background: #0b572d;
      border-color: var(--green);
      color: #fff;
    }

    .danger {
      background: #32151d;
      border-color: var(--red);
    }

    input {
      width: 100%;
      border: 1px solid var(--line);
      background: #07111d;
      color: var(--text);
      border-radius: 12px;
      padding: 13px;
      outline: none;
    }

    input:focus {
      border-color: var(--accent);
    }

    .page {
      display: none;
      min-height: 100vh;
    }

    .page.active {
      display: block;
    }

    .user-page {
      display: none;
    }

    .card {
      background:
      radial-gradient(circle at top right, rgba(234,255,0,.06), transparent 35%),
                            linear-gradient(145deg, #10243a 0%, #07111e 100%);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 22px;
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
  }

  .card h2 {
    margin: 0 0 8px;
    font-size: 22px;
  }

  .card p {
    color: var(--muted);
    line-height: 1.6;
  }

  .muted {
    color: var(--muted);
  }

  .small {
    font-size: 13px;
  }

  .hidden {
    display: none !important;
  }

  .auth-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .auth-card {
    width: 100%;
    max-width: 460px;
  }

  .brand {
    text-align: center;
    margin-bottom: 22px;
  }

  .brand h1 {
    margin: 0;
    font-size: 30px;
    font-weight: 900;
    letter-spacing: 0.5px;
  }

  .brand p {
    margin: 8px 0 0;
    color: var(--muted);
  }

  .form-group {
    margin-bottom: 14px;
  }

  .form-group label {
    display: block;
    margin-bottom: 7px;
    font-size: 13px;
    font-weight: 700;
  }

  .row {
    display: flex;
    gap: 12px;
    align-items: center;
  }

  .row > * {
    flex: 1;
  }

  .actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 16px;
  }

  .link-btn {
    background: transparent;
    border: 0;
    color: var(--accent);
    padding: 6px 0;
    cursor: pointer;
    font-weight: 700;
  }

  .link-btn:hover {
    text-decoration: underline;
  }

  .message {
    margin-top: 14px;
    padding: 12px;
    border-radius: 12px;
    background: #101b2a;
    border: 1px solid var(--line);
    color: var(--text);
    display: none;
  }

  .message.show {
    display: block;
  }

  .message.error {
    border-color: var(--red);
    color: #ffd7d7;
  }

  .message.success {
    border-color: var(--green);
    color: #d7ffe5;
  }

  .topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    background: rgba(5, 12, 20, 0.94);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line);
    padding: 14px 20px;
  }

  .topbar-inner {
    max-width: 1400px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 900;
    color: var(--text);
  }

  .logo-mark {
    width: 38px;
    height: 38px;
    border-radius: 12px;
    display: grid;
    place-items: center;
    background: var(--accent);
    color: #07111e;
    font-weight: 900;
  }

  .logo-text {
    font-size: 17px;
  }

  .top-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 7px 11px;
    border-radius: 999px;
    background: #0d1c2b;
    border: 1px solid var(--line);
    color: var(--muted);
    font-size: 12px;
    font-weight: 800;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #657080;
  }

  .status-dot.online {
    background: var(--green);
    box-shadow: 0 0 10px rgba(87, 255, 147, 0.7);
  }

  .user-shell {
    max-width: 1400px;
    margin: 0 auto;
    padding: 22px;
    display: grid;
    grid-template-columns: 230px minmax(0, 1fr);
    gap: 18px;
    align-items: start;
  }

  .sidebar {
    position: sticky;
    top: 78px;
    background: rgba(7, 16, 27, 0.96);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 12px;
  }

  .side-user {
    padding: 14px;
    border-radius: 14px;
    background: linear-gradient(145deg, #12263a, #08121e);
    margin-bottom: 12px;
  }

  .side-user strong {
    display: block;
    font-size: 17px;
  }

  .side-user small {
    color: var(--muted);
  }

  .side-btn {
    width: 100%;
    text-align: left;
    margin: 4px 0;
    background: transparent;
    border-color: transparent;
  }

  .side-btn.active {
    background: rgba(234, 255, 0, 0.1);
    border-color: #65720e;
    color: var(--accent);
    font-weight: 900;
  }

  .user-content {
    min-width: 0;
  }

  .user-page {
    display: none;
  }

  .user-page.active {
    display: block;
  }

  .hero {
    padding: 24px;
    border-radius: 20px;
    background:
      radial-gradient(circle at top right, rgba(234,255,0,.12), transparent 35%),
      linear-gradient(145deg, #10243a, #07111e);
    border: 1px solid var(--line);
    margin-bottom: 18px;
  }

  .hero h1 {
    margin: 0;
    font-size: 30px;
  }

  .hero p {
    margin: 8px 0 0;
    color: var(--muted);
    line-height: 1.6;
  }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 14px;
    margin-bottom: 18px;
  }

  .stat-card {
    background: #0b1725;
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 18px;
  }

  .stat-card small {
    display: block;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .stat-card strong {
    display: block;
    font-size: 24px;
  }

  .stat-card .green {
    color: var(--green);
  }

  .game-card {
    position: relative;
    overflow: hidden;
    padding: 24px;
    border-radius: 20px;
    background:
      radial-gradient(circle at top right, rgba(87,255,147,.08), transparent 38%),
      linear-gradient(145deg, #10243a, #07111e);
    border: 1px solid var(--line);
    margin-bottom: 18px;
  }

  .game-card h2 {
    margin: 0 0 8px;
    font-size: 24px;
  }

  .game-card p {
    color: var(--muted);
    line-height: 1.6;
  }

  .game-actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 18px;
  }

  .fivem-button {
    min-width: 180px;
    font-size: 16px;
    font-weight: 900;
  }

  .server-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
  }

  .server-card {
    background: #0b1725;
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 18px;
  }

  .server-card h3 {
    margin: 0 0 7px;
  }

  .server-card p {
    color: var(--muted);
    margin: 6px 0;
  }

  .server-status {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    margin-top: 8px;
    font-size: 13px;
    font-weight: 800;
  }
      .server-status .status-dot {
    flex-shrink: 0;
  }

  .profile-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
  }

  .profile-item {
    background: #0b1725;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
  }

  .profile-item small {
    display: block;
    color: var(--muted);
    margin-bottom: 7px;
  }

  .profile-item strong {
    display: block;
    word-break: break-word;
  }

  .buy-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 14px;
  }

  .buy-card {
    background: #0b1725;
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 20px;
    text-align: center;
  }

  .buy-card h3 {
    margin: 0 0 8px;
  }

  .buy-card .minutes-value {
    font-size: 28px;
    font-weight: 900;
    margin: 12px 0;
    color: var(--accent);
  }

  .buy-card p {
    color: var(--muted);
    min-height: 42px;
  }

  .settings-list {
    display: grid;
    gap: 12px;
  }

  .setting-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 16px;
    background: #0b1725;
    border: 1px solid var(--line);
    border-radius: 14px;
  }

  .setting-item strong {
    display: block;
    margin-bottom: 4px;
  }

  .setting-item small {
    color: var(--muted);
  }

  .support-box {
    background: #0b1725;
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 20px;
  }

  .support-box h3 {
    margin-top: 0;
  }

  .support-box p {
    color: var(--muted);
    line-height: 1.6;
  }

  .admin-shell {
    max-width: 1400px;
    margin: 0 auto;
    padding: 22px;
  }

  .admin-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    margin-bottom: 18px;
  }

  .admin-header h1 {
    margin: 0;
    font-size: 28px;
  }

  .admin-header p {
    margin: 5px 0 0;
    color: var(--muted);
  }

  .admin-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 14px;
    margin-bottom: 18px;
  }

  .admin-card {
    background: #0b1725;
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 18px;
  }

  .admin-card h3 {
    margin: 0 0 8px;
  }

  .admin-card strong {
    font-size: 24px;
  }

  .admin-section {
    margin-bottom: 18px;
  }

  .admin-section h2 {
    margin: 0 0 12px;
    font-size: 20px;
  }

  .admin-table-wrap {
    overflow-x: auto;
    background: #0b1725;
    border: 1px solid var(--line);
    border-radius: 16px;
  }

  .admin-table {
    width: 100%;
    border-collapse: collapse;
    min-width: 650px;
  }

  .admin-table th,
  .admin-table td {
    padding: 13px 14px;
    text-align: left;
    border-bottom: 1px solid var(--line);
  }

  .admin-table th {
    color: var(--muted);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .admin-table tr:last-child td {
    border-bottom: 0;
  }

  .stream-panel {
    background:
      radial-gradient(circle at top right, rgba(87,255,147,.07), transparent 35%),
      #0b1725;
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 20px;
  }

  .stream-panel h3 {
    margin-top: 0;
  }

  .stream-info {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
  }

  .stream-info-item {
    padding: 14px;
    background: #08121e;
    border: 1px solid var(--line);
    border-radius: 12px;
  }

  .stream-info-item small {
    display: block;
    color: var(--muted);
    margin-bottom: 5px;
  }

  .stream-info-item strong {
    word-break: break-word;
  }
      .admin-actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 16px;
  }

  .admin-actions button {
    min-width: 140px;
  }

  .danger-zone {
    border: 1px solid rgba(255, 92, 92, 0.35);
    background: rgba(80, 20, 20, 0.18);
    border-radius: 16px;
    padding: 18px;
  }

  .danger-zone h3 {
    margin-top: 0;
    color: #ffbcbc;
  }

  .footer {
    max-width: 1400px;
    margin: 0 auto;
    padding: 20px 22px 35px;
    color: var(--muted);
    text-align: center;
    font-size: 12px;
  }

  .empty-state {
    padding: 30px;
    text-align: center;
    color: var(--muted);
    border: 1px dashed var(--line);
    border-radius: 14px;
  }

  .loading {
    opacity: 0.7;
    pointer-events: none;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    padding: 5px 9px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 900;
    background: #12263a;
    border: 1px solid var(--line);
  }

  .badge.green {
    color: var(--green);
    border-color: rgba(87, 255, 147, 0.35);
  }

  .badge.red {
    color: #ffbcbc;
    border-color: rgba(255, 92, 92, 0.35);
  }

  .divider {
    height: 1px;
    background: var(--line);
    margin: 18px 0;
  }

  @media (max-width: 1050px) {
    .user-shell {
      grid-template-columns: 200px minmax(0, 1fr);
    }

    .stats-grid,
    .admin-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .buy-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
  }

  @media (max-width: 800px) {
    .user-shell {
      grid-template-columns: 1fr;
    }

    .sidebar {
      position: static;
    }

    .side-nav {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 4px;
    }

    .side-user {
      margin-bottom: 8px;
    }

    .server-grid,
    .profile-grid,
    .stream-info {
      grid-template-columns: 1fr;
    }
  }
  /* ===== VISUAL PREMIUM IMPÉRIO GAMECLOUD ===== */

body {
  background:
    radial-gradient(circle at 15% 10%, rgba(255, 220, 40, 0.10), transparent 28%),
    radial-gradient(circle at 90% 15%, rgba(0, 190, 255, 0.10), transparent 30%),
    linear-gradient(145deg, #02060b 0%, #06111d 48%, #02050a 100%);
}

.topbar {
  background:
    linear-gradient(90deg, #05080d, #0b1725, #05080d);
  border-bottom: 1px solid rgba(255, 221, 40, 0.25);
  box-shadow: 0 4px 25px rgba(0, 0, 0, 0.45);
}

.brand {
  color: #ffffff;
  font-weight: 900;
  letter-spacing: 0.5px;
}

.brand span {
  color: #ffdf00;
}

.brand small {
  color: #8fa5ba;
}

.status-pill {
  background: rgba(255, 221, 40, 0.08);
  border: 1px solid rgba(255, 221, 40, 0.28);
  color: #dce8f2;
  box-shadow: 0 0 18px rgba(255, 221, 40, 0.06);
}

.user-shell {
  gap: 18px;
}

.sidebar {
  background:
    linear-gradient(180deg, rgba(10, 25, 41, 0.98), rgba(3, 10, 18, 0.98));
  border: 1px solid rgba(90, 130, 165, 0.25);
  box-shadow:
    0 15px 40px rgba(0, 0, 0, 0.45),
    inset 0 1px rgba(255, 255, 255, 0.03);
}

.side-user {
  background:
    linear-gradient(135deg, rgba(255, 221, 40, 0.10), rgba(0, 160, 255, 0.05));
  border: 1px solid rgba(255, 221, 40, 0.12);
  border-radius: 14px;
  padding: 14px;
}

.side-user strong {
  color: #ffffff;
}

.side-user small {
  color: #8fa5ba;
}

.side-btn {
  border: 1px solid transparent;
  background: transparent;
  color: #aebdca;
  transition: 0.2s ease;
}

.side-btn:hover {
  background: rgba(255, 221, 40, 0.07);
  color: #ffffff;
}

.side-btn.active {
  background:
    linear-gradient(90deg, rgba(255, 221, 40, 0.18), rgba(255, 221, 40, 0.04));
  border-color: rgba(255, 221, 40, 0.25);
  color: #ffdf00;
  box-shadow: inset 3px 0 #ffdf00;
}

.side-logout {
  border: 1px solid rgba(255, 80, 80, 0.22);
}

.dashboard-head {
  background:
    radial-gradient(circle at 90% 0%, rgba(255, 221, 40, 0.12), transparent 32%),
    linear-gradient(135deg, rgba(12, 31, 49, 0.95), rgba(5, 14, 24, 0.95));
  border: 1px solid rgba(100, 145, 180, 0.18);
  border-radius: 18px;
  padding: 24px;
  box-shadow: 0 18px 45px rgba(0, 0, 0, 0.25);
}

.dashboard-head h1 {
  color: #ffffff;
  text-shadow: 0 2px 18px rgba(255, 255, 255, 0.08);
}

.balance {
  background:
    linear-gradient(135deg, rgba(255, 221, 40, 0.18), rgba(255, 221, 40, 0.04));
  border: 1px solid rgba(255, 221, 40, 0.30);
  border-radius: 16px;
  padding: 16px 20px;
  box-shadow: 0 0 25px rgba(255, 221, 40, 0.08);
}

.balance strong {
  color: #ffdf00;
  text-shadow: 0 0 18px rgba(255, 221, 40, 0.25);
}

.stats-grid .stat {
  background:
    linear-gradient(145deg, #0d2135, #07121f);
  border: 1px solid rgba(90, 140, 180, 0.22);
  border-radius: 16px;
  box-shadow:
    0 12px 30px rgba(0, 0, 0, 0.28),
    inset 0 1px rgba(255, 255, 255, 0.03);
}

.stat-icon {
  background: rgba(255, 221, 40, 0.08);
  border: 1px solid rgba(255, 221, 40, 0.15);
}

.game-card {
  background:
    radial-gradient(circle at 85% 15%, rgba(255, 221, 40, 0.16), transparent 30%),
    radial-gradient(circle at 10% 90%, rgba(0, 170, 255, 0.12), transparent 35%),
    linear-gradient(145deg, #10283e, #06111e);
  border: 1px solid rgba(255, 221, 40, 0.25);
  border-radius: 20px;
  box-shadow:
    0 20px 55px rgba(0, 0, 0, 0.40),
    0 0 30px rgba(255, 221, 40, 0.05);
}

.game-card h2 {
  color: #ffffff;
  font-size: 25px;
}

.game-icon {
  font-size: 55px;
  filter: drop-shadow(0 0 15px rgba(255, 221, 40, 0.35));
}

.stream-box {
  background:
    linear-gradient(135deg, rgba(0, 0, 0, 0.28), rgba(8, 25, 40, 0.65));
  border: 1px solid rgba(120, 160, 190, 0.20);
  border-radius: 14px;
}

.stream-title {
  color: #ffffff;
  font-weight: 900;
}

.game-actions .primary,
.primary {
  background:
    linear-gradient(135deg, #fff000, #ffcf00);
  color: #101010;
  border: 1px solid #ffe600;
  font-weight: 900;
  box-shadow:
    0 8px 22px rgba(255, 214, 0, 0.20),
    inset 0 1px rgba(255, 255, 255, 0.45);
}

.game-actions .primary:hover,
.primary:hover {
  filter: brightness(1.08);
  box-shadow:
    0 10px 28px rgba(255, 214, 0, 0.32);
}

.server-grid {
  gap: 16px;
}

.server-card {
  background:
    linear-gradient(145deg, #0d2135, #07121f);
  border: 1px solid rgba(90, 145, 185, 0.22);
  border-radius: 17px;
  box-shadow: 0 14px 35px rgba(0, 0, 0, 0.30);
  transition: 0.2s ease;
}

.server-card:hover {
  transform: translateY(-2px);
  border-color: rgba(255, 221, 40, 0.30);
  box-shadow:
    0 18px 40px rgba(0, 0, 0, 0.35),
    0 0 22px rgba(255, 221, 40, 0.05);
}

.server-status {
  color: #8dff8d;
}

.card {
  background:
    linear-gradient(145deg, rgba(12, 29, 46, 0.96), rgba(5, 13, 22, 0.96));
  border: 1px solid rgba(90, 140, 180, 0.20);
  box-shadow: 0 18px 45px rgba(0, 0, 0, 0.28);
}

.buy-card {
  background:
    radial-gradient(circle at top right, rgba(255, 221, 40, 0.13), transparent 35%),
    linear-gradient(145deg, #10263c, #07121f);
  border: 1px solid rgba(255, 221, 40, 0.20);
  border-radius: 18px;
  box-shadow: 0 15px 38px rgba(0, 0, 0, 0.30);
}

.buy-card .minutes-value {
  color: #ffdf00;
  text-shadow: 0 0 20px rgba(255, 221, 40, 0.20);
}

.profile-item,
.setting-item {
  background: rgba(11, 27, 43, 0.85);
  border: 1px solid rgba(90, 140, 180, 0.18);
}

.support-box {
  background:
    radial-gradient(circle at top right, rgba(255, 221, 40, 0.10), transparent 35%),
    linear-gradient(145deg, #0d2135, #06111e);
  border: 1px solid rgba(255, 221, 40, 0.18);
  box-shadow: 0 18px 45px rgba(0, 0, 0, 0.30);
}

.badge.green {
  color: #9cff9c;
  border-color: rgba(87, 255, 147, 0.30);
  background: rgba(87, 255, 147, 0.08);
}
</head>

<body>

<header>
  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        👑 IMPÉRIO <span>GAMECLOUD</span>
        <small>FiveM na nuvem</small>
      </div>

      <div class="status-pill">
        <span class="status-dot"></span>
        GameCloud
      </div>
    </div>
  </div>
</header>

<main class="wrap">

  <p id="message" role="status" aria-live="polite"></p>

  <!-- LOGIN -->
  <section id="login" class="page active">
    <div class="card auth">
      <div class="auth-logo">👑</div>

      <h1>Entrar no GameCloud</h1>

      <p class="muted">
        Acesse sua conta e jogue FiveM na nuvem.
      </p>

      <form id="loginForm">

        <label>E-mail</label>
        <input
          id="email"
          type="email"
          autocomplete="username"
          placeholder="Seu e-mail"
          required
        >

        <label>Senha</label>
        <input
          id="password"
          type="password"
          autocomplete="current-password"
          placeholder="Sua senha"
          required
        >

        <label class="row">
          <input id="remember" type="checkbox" checked>
          Manter conectado neste aparelho
        </label>

        <button class="primary wide" type="submit">
          🚀 Entrar
        </button>

      </form>

      <div class="auth-links">
        <button id="showRegister" type="button">
          Criar conta
        </button>

        <button id="showForgot" type="button">
          Esqueci minha senha
        </button>
      </div>
    </div>
  </section>


  <!-- CADASTRO -->
  <section id="register" class="page">
    <div class="card auth">

      <div class="auth-logo">👤</div>

      <h1>Criar conta</h1>

      <p class="muted">
        Crie sua conta para acessar o Império GameCloud.
      </p>

      <form id="registerForm">

        <label>Nome</label>
        <input
          id="rname"
          type="text"
          maxlength="60"
          placeholder="Seu nome"
          required
        >

        <label>E-mail</label>
        <input
          id="remail"
          type="email"
          autocomplete="email"
          placeholder="Seu e-mail"
          required
        >

        <label>Senha</label>
        <input
          id="rpassword"
          type="password"
          autocomplete="new-password"
          minlength="8"
          placeholder="Mínimo 8 caracteres"
          required
        >

        <button class="primary wide" type="submit">
          Criar minha conta
        </button>

      </form>

      <button
        id="backLoginFromRegister"
        class="wide"
        type="button"
      >
        ← Voltar para o login
      </button>

    </div>
  </section>


  <!-- ESQUECI A SENHA -->
  <section id="forgot" class="page">
    <div class="card auth">

      <div class="auth-logo">🔐</div>

      <h1>Recuperar senha</h1>

      <p class="muted">
        Informe o e-mail cadastrado para solicitar a recuperação.
      </p>

      <form id="forgotForm">

        <label>E-mail</label>

        <input
          id="femail"
          type="email"
          placeholder="Seu e-mail"
          required
        >

        <button class="primary wide" type="submit">
          Solicitar recuperação
        </button>

      </form>

      <button
        id="backLoginFromForgot"
        class="wide"
        type="button"
      >
        ← Voltar
      </button>

    </div>
  </section>


  <!-- NOVA SENHA -->
  <section id="reset" class="page">
    <div class="card auth">

      <div class="auth-logo">🔑</div>

      <h1>Nova senha</h1>

      <p class="muted">
        Digite sua nova senha.
      </p>

      <form id="resetForm">

        <label>Nova senha</label>

        <input
          id="newpassword"
          type="password"
          minlength="8"
          placeholder="Nova senha"
          required
        >

        <button class="primary wide" type="submit">
          Alterar senha
        </button>

      </form>

      <button
        id="backLoginFromReset"
        class="wide"
        type="button"
      >
        ← Voltar para o login
      </button>

    </div>
  </section>


  <!-- PAINEL DO USUÁRIO -->
  <section id="user" class="page">

    <div class="user-shell">

      <aside class="sidebar">

        <div class="side-user">
          <strong id="sideName">👤 Jogador</strong>
          <small>Cliente GameCloud</small>
        </div>

        <div class="side-menu">

          <button
            class="side-btn active"
            data-page="home"
            type="button"
          >
            🏠 Início
          </button>

          <button
            class="side-btn"
            data-page="servers"
            type="button"
          >
            🎮 FiveM
          </button>

          <button
            class="side-btn"
            data-page="buy"
            type="button"
          >
            💰 Comprar minutos
          </button>

          <button
            class="side-btn"
            data-page="profile"
            type="button"
          >
            👤 Meu perfil
          </button>

          <button
            class="side-btn"
            data-page="settings"
            type="button"
          >
            ⚙️ Configurações
          </button>

          <button
            class="side-btn"
            data-page="support"
            type="button"
          >
            🎧 Suporte
          </button>

        </div>

        <button
          class="side-logout logout"
          type="button"
        >
          🚪 Sair da conta
        </button>

      </aside>


      <div class="user-content">

        <!-- INÍCIO -->
        <section
          id="home"
          class="user-page"
          style="display:block;"
        >

          <div class="dashboard-head">

            <div class="head-row">

              <div>
                <span class="badge green">
                  ● CONTA ATIVA
                </span>

                <h1>
                  Bem-vindo,
                  <span id="greetingName">Jogador</span>!
                </h1>

                <p class="muted">
                  Seu painel pessoal do Império GameCloud.
                </p>
              </div>

              <div class="balance">

                <small>
                  Tempo disponível
                </small>

                <strong id="minutes">
                  0 minutos
                </strong>

              </div>

            </div>

          </div>


          <div class="stats-grid">

            <div class="stat">
              <div class="stat-icon">🎮</div>
              <small>Jogo</small>
              <strong>FiveM</strong>
            </div>

            <div class="stat">
              <div class="stat-icon">🟢</div>
              <small>GameCloud</small>
              <strong id="playerMiniStatus">
                Verificando...
              </strong>
            </div>

            <div class="stat">
              <div class="stat-icon">⏱️</div>
              <small>Seu saldo</small>
              <strong id="minutesMini">
                0 min
              </strong>
            </div>

          </div>


          <div class="game-card">

            <div class="game-card-top">

              <div>

                <span class="badge green">
                  🎮 FIVE M
                </span>

                <h2>
                  FiveM na nuvem
                </h2>

                <p class="muted">
                  Jogue FiveM usando o computador GameCloud.
                </p>

              </div>

              <div class="game-icon">
                🎮
              </div>

            </div>


            <div class="stream-box">

              <div
                id="playerStreamStatus"
                class="stream-title"
              >
                Verificando...
              </div>

              <div
                id="playerStreamMessage"
                class="stream-message"
              >
                Aguarde enquanto verificamos
                o computador GameCloud.
              </div>

            </div>


            <div class="game-actions">

              <button
                id="playerStart"
                class="primary"
                type="button"
              >
                🎮 Iniciar FiveM
              </button>

              <button
                id="refresh"
                type="button"
              >
                🔄 Atualizar
              </button>

            </div>

          </div>


          <div class="card">

            <div class="section-title">

              <div>
                <h2>⚡ Acesso rápido</h2>

                <p class="muted">
                  Acesse rapidamente os recursos do GameCloud.
                </p>
              </div>

            </div>


            <div class="server-grid">

              <div class="server-card">

                <h3>🎮 FiveM</h3>

                <span class="server-status">
                  ● GameCloud
                </span>

                <p>
                  Entre no servidor e inicie seu FiveM.
                </p>

                <button
                  class="primary wide"
                  data-page="servers"
                  type="button"
                >
                  Abrir FiveM
                </button>

              </div>


              <div class="server-card">

                <h3>💰 Minutos</h3>

                <span class="server-status">
                  ● Seu saldo
                </span>

                <p>
                  Compre mais tempo para jogar.
                </p>

                <button
                  id="buyMinutes"
                  class="primary wide"
                  type="button"
                >
                  Comprar minutos
                </button>

              </div>


              <div class="server-card">

                <h3>🎧 Suporte</h3>

                <span class="server-status">
                  ● Ajuda
                </span>

                <p>
                  Precisa de ajuda com o GameCloud?
                </p>

                <button
                  class="wide"
                  data-page="support"
                  type="button"
                >
                  Abrir suporte
                </button>

              </div>

            </div>

          </div>

        </section>


        <!-- FIVEM / SERVIDORES -->
        <section
          id="servers"
          class="user-page"
          style="display:none;"
        >

          <div class="dashboard-head">

            <h1>🎮 FiveM</h1>

            <p class="muted">
              Controle seu acesso ao FiveM na nuvem.
            </p>

          </div>


          <div class="server-grid">

            <div class="server-card">

              <h2>🎮 Império Roleplay</h2>

              <span class="server-status">
                ● GameCloud
              </span>

              <p>
                FiveM • Servidor principal
                do Império GameCloud.
              </p>

              <div class="stream-box">

                <div
                  id="playerStreamStatus2"
                  class="stream-title"
                >
                  Verificando...
                </div>

                <p
                  id="serverStatusText"
                  class="muted"
                >
                  Aguardando computador GameCloud.
                </p>

              </div>

              <div class="game-actions">

                <button
                  id="playerStart2"
                  class="primary wide"
                  type="button"
                >
                  🎮 Iniciar FiveM
                </button>

                <button
                  id="refreshServer"
                  class="wide"
                  type="button"
                >
                  🔄 Atualizar servidor
                </button>

              </div>

              <div class="profile-item">

                <small>
                  Seu tempo disponível
                </small>

                <strong id="minutesServer">
                  0 minutos
                </strong>

              </div>

            </div>


            <div class="server-card">

              <h2>🟢 Status</h2>

              <p class="muted">
                O GameCloud informa automaticamente
                o estado do computador.
              </p>

              <span class="server-status">
                ● FiveM
              </span>

            </div>

          </div>

        </section>
               <!-- COMPRAR MINUTOS -->
        <section
          id="buy"
          class="user-page"
          style="display:none;"
        >

          <div class="dashboard-head">

            <h1>💰 Comprar minutos</h1>

            <p class="muted">
              Escolha uma opção de tempo para jogar no GameCloud.
            </p>

          </div>


          <div class="buy-grid">

            <div class="buy-card">

              <span class="badge green">
                ⚡ MAIS POPULAR
              </span>

              <h3>Pacote Inicial</h3>

              <div class="minutes-value">
                60 minutos
              </div>

              <p>
                Ideal para testar o GameCloud.
              </p>

              <button
                class="primary wide"
                type="button"
                onclick="alert('Sistema de compra em configuração.')"
              >
                Comprar 60 minutos
              </button>

            </div>


            <div class="buy-card">

              <span class="badge">
                🎮 PACOTE GAMECLOUD
              </span>

              <h3>Pacote Gamer</h3>

              <div class="minutes-value">
                180 minutos
              </div>

              <p>
                Mais tempo para jogar FiveM.
              </p>

              <button
                class="primary wide"
                type="button"
                onclick="alert('Sistema de compra em configuração.')"
              >
                Comprar 180 minutos
              </button>

            </div>


            <div class="buy-card">

              <span class="badge">
                👑 PACOTE PREMIUM
              </span>

              <h3>Pacote Premium</h3>

              <div class="minutes-value">
                600 minutos
              </div>

              <p>
                Para quem joga com frequência.
              </p>

              <button
                class="primary wide"
                type="button"
                onclick="alert('Sistema de compra em configuração.')"
              >
                Comprar 600 minutos
              </button>

            </div>

          </div>

        </section>


        <!-- PERFIL -->
        <section
          id="profile"
          class="user-page"
          style="display:none;"
        >

          <div class="dashboard-head">

            <h1>👤 Meu perfil</h1>

            <p class="muted">
              Consulte os dados da sua conta GameCloud.
            </p>

          </div>


          <div class="card">

            <div class="profile-list">

              <div class="profile-item">

                <small>Nome</small>

                <strong id="profileName">
                  Jogador
                </strong>

              </div>


              <div class="profile-item">

                <small>Usuário</small>

                <strong id="profileUsername">
                  -
                </strong>

              </div>


              <div class="profile-item">

                <small>E-mail</small>

                <strong id="profileEmail">
                  -
                </strong>

              </div>


              <div class="profile-item">

                <small>Tempo disponível</small>

                <strong id="profileMinutes">
                  0 minutos
                </strong>

              </div>

            </div>

          </div>

        </section>


        <!-- CONFIGURAÇÕES -->
        <section
          id="settings"
          class="user-page"
          style="display:none;"
        >

          <div class="dashboard-head">

            <h1>⚙️ Configurações</h1>

            <p class="muted">
              Configurações da sua conta.
            </p>

          </div>


          <div class="settings-list">

            <div class="setting-item">

              <div>

                <strong>Manter sessão conectada</strong>

                <small>
                  Permite permanecer conectado neste aparelho.
                </small>

              </div>

              <span class="badge green">
                Ativo
              </span>

            </div>


            <div class="setting-item">

              <div>

                <strong>Conta GameCloud</strong>

                <small>
                  Sua conta está disponível para acessar o painel.
                </small>

              </div>

              <span class="badge green">
                Ativa
              </span>

            </div>


            <div class="setting-item">

              <div>

                <strong>FiveM</strong>

                <small>
                  O acesso depende do computador GameCloud estar online.
                </small>

              </div>

              <span class="badge">
                GameCloud
              </span>

            </div>

          </div>

        </section>


        <!-- SUPORTE -->
        <section
          id="support"
          class="user-page"
          style="display:none;"
        >

          <div class="dashboard-head">

            <h1>🎧 Suporte</h1>

            <p class="muted">
              Precisa de ajuda com o Império GameCloud?
            </p>

          </div>


          <div class="support-box">

            <h3>
              Atendimento GameCloud
            </h3>

            <p>
              Se você tiver problemas para entrar,
              iniciar o FiveM ou utilizar seus minutos,
              entre em contato com o suporte.
            </p>

            <div class="game-actions">

              <button
                class="primary"
                type="button"
                onclick="alert('Canal de suporte em configuração.')"
              >
                🎧 Abrir suporte
              </button>

              <button
                type="button"
                data-page="home"
              >
                ← Voltar ao início
              </button>

            </div>

          </div>

        </section>

      </div>

    </div>

  </section>


  <!-- PAINEL ADMINISTRADOR -->
  <section id="admin" class="page">

    <div class="admin-shell">

      <div class="admin-header">

        <div>

          <span class="badge green">
            👑 ADMINISTRADOR
          </span>

          <h1>
            Painel Administrativo
          </h1>

          <p class="muted">
            Gerencie usuários, minutos e o GameCloud.
          </p>

        </div>

        <button
          id="logoutAdmin"
          class="danger"
          type="button"
        >
          🚪 Sair
        </button>

      </div>


      <div class="admin-grid">

        <div class="card">

          <h2>👥 Usuários</h2>

          <div id="users">
            Carregando usuários...
          </div>

          <div class="game-actions">

            <button
              id="refreshAdmin"
              class="primary"
              type="button"
            >
              🔄 Atualizar
            </button>

          </div>

        </div>


        <div class="card">

          <h2>🟢 GameCloud</h2>

          <p>
            Status:
            <strong id="online">
              Verificando...
            </strong>
          </p>

          <p>
            Streaming:
            <strong id="streamStatus">
              Verificando...
            </strong>
          </p>

          <p>
            Jogo:
            <strong id="streamGame">
              FiveM
            </strong>
          </p>

          <p>
            Computador:
            <strong id="streamHost">
              -
            </strong>
          </p>

          <p id="streamMessage">
            -
          </p>

          <p>
            Último heartbeat:
            <strong id="streamHeartbeat">
              -
            </strong>
          </p>

          <div class="game-actions">

            <button
              id="startStream"
              class="primary"
              type="button"
            >
              ▶️ Iniciar streaming
            </button>

            <button
              id="stopStream"
              class="danger"
              type="button"
            >
              ⏹️ Parar streaming
            </button>

            <button
              id="toggleStream"
              type="button"
            >
              🔄 Alternar
            </button>

            <button
              id="refreshStream"
              type="button"
            >
              🔄 Atualizar status
            </button>

          </div>

        </div>


        <div class="card">

          <h2>⏱️ Adicionar minutos</h2>

          <p class="muted">
            Adicione tempo à conta de um jogador.
          </p>

          <form id="timeForm">

            <label>
              E-mail do jogador
            </label>

            <input
              id="playerEmail"
              type="email"
              placeholder="E-mail do jogador"
              required
            >

            <label>
              Minutos
            </label>

            <input
              id="addMinutes"
              type="number"
              min="1"
              placeholder="Ex.: 60"
              required
            >

            <button
              class="primary wide"
              type="submit"
            >
              ➕ Adicionar minutos
            </button>

          </form>

        </div>

        <div class="card">

          <h2>🎮 Jogadores online</h2>

          <div id="players">
            Carregando...
          </div>

        </div>

      </div>

    </div>

  </section>

</main>


<script src="app.js"></script>

</body>
</html>
